apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-api-doc-https-redirect
  namespace: development
spec:
  parentRefs:
  - name: nginx-migration-pilot
    sectionName: http-redirect
  hostnames:
  - open-api-doc.dev-waiverforeverk8s.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        port: 443
        statusCode: 301
