apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-api-doc-migration-pilot
  namespace: development
spec:
  parentRefs:
  - name: nginx-migration-pilot
    sectionName: http
  hostnames:
  - open-api-doc.dev-waiverforeverk8s.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Proto
          value: https
        - name: X-Forwarded-Port
          value: '443'
        - name: X-Forwarded-Host
          value: open-api-doc.dev-waiverforeverk8s.com
        - name: X-Forwarded-Scheme
          value: https
        - name: X-Scheme
          value: https
    backendRefs:
    - name: open-api-doc
      port: 80
