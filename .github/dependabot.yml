version: 2
updates:
- package-ecosystem: bundler
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 3
  groups:
    maintenance:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  cooldown:
    default-days: 3
  groups:
    maintenance:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
